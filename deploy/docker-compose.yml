# SauronID local stack: core + ZKP issuer + dashboard + EVM node.
# Archived banking services (partner-portal, anomaly-engine, analytics) removed —
# see archive/banking-2025/ for the pre-pivot product surface.
services:
  # ── Rust backend (Sauron Core) ──────────────────────────────────────────────
  backend:
    # Context is the repo root: core's manifest has a path dependency on
    # transparent-zk/types. See the comment at the top of core/Dockerfile.
    build:
      context: ..
      dockerfile: core/Dockerfile
    image: hackeurope-24-backend:latest
    container_name: sauron-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ENV=${ENV:-development}
      - SAURON_ACCEPT_SINGLE_NODE_SQLITE=${SAURON_ACCEPT_SINGLE_NODE_SQLITE:-1}
      - SAURON_ISSUER_URL=${SAURON_ISSUER_URL:-http://zkp-issuer:4000}
      - SAURON_ISSUER_SHARED_SECRET=${SAURON_ISSUER_SHARED_SECRET:-sauron_issuer_shared_dev_key_change_me}
      # The e2e suites provision their own users through /dev/register_user,
      # which is compiled behind this flag. Without it the route 404s and the
      # scripts fail on an empty response body — which is what "register_user
      # failed:" with nothing after the colon meant. Dev-only by construction:
      # the handler also refuses to run outside a development runtime.
      - SAURON_ENABLE_DEV_ENDPOINTS=${SAURON_ENABLE_DEV_ENDPOINTS:-1}
      # Advisory by default HERE ONLY, and deliberately: this is the stack the KYA
      # e2e job drives, and redteam/dist/index.js (the scripted invariant suite)
      # posts UNSIGNED to /agent/action/challenge and /agent/vc/issue, so
      # enforcement turns those scenarios into 401s. The root docker-compose.yml
      # evaluation stack and docker-compose.prod.yml both default to 1 — this is
      # the exception, not the pattern. Flip it once those scenarios sign their
      # calls (they also send a malformed PoP key today, which fails in either
      # mode: "PoP public key is not base64url").
      - SAURON_REQUIRE_CALL_SIG=${SAURON_REQUIRE_CALL_SIG:-0}
      # Required. Production requires >=32-byte keys; see admin::init_admin_auth.
      # Quoted: the ": " inside the :? message makes YAML read the whole entry
      # as a mapping, and compose then refuses to load the file at all.
      - "SAURON_ADMIN_KEY=${SAURON_ADMIN_KEY:?SAURON_ADMIN_KEY is required — generate one with openssl rand -hex 32, then export it or put it in deploy/.env}"
    healthcheck:
      # /healthz, not /admin/stats: that view is deployment-global and answers
      # 401 unless the key is a cross-tenant super-admin, so the container would
      # never report healthy and `dashboard` (depends_on: service_healthy) would
      # wait forever.
      test: [ "CMD-SHELL", "curl -sf http://localhost:3001/healthz || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ── Dashboard (Next.js — Mandate Console, port 3000) ────────────────────────
  dashboard:
    build:
      context: ../dashboard
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    container_name: sauron-dashboard
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
      - SAURON_CORE_INTERNAL_URL=http://backend:3001
      # Quoted: the ": " inside the :? message makes YAML read the whole entry
      # as a mapping, and compose then refuses to load the file at all.
      - "SAURON_ADMIN_KEY=${SAURON_ADMIN_KEY:?SAURON_ADMIN_KEY is required — generate one with openssl rand -hex 32, then export it or put it in deploy/.env}"
      # Dashboard API routes require the signed dev/dev operator session (or
      # SAURON_DASHBOARD_OPERATORS in a shared environment). Never enable the
      # removed unauthenticated proxy compatibility switch.
    restart: unless-stopped

  # ── Hardhat Local EVM Node (port 8545) ──────────────────────────────────────
  # A `hardhat-node` service used to live here, building ../contracts/revocation.
  # That directory went with the banking surface (contracts/ now holds only
  # sauron_ledger), and compose validates every build context when it loads the
  # file — so `up -d backend` failed instantly with a missing build path no
  # matter which service was selected. Nothing referenced it. Removed.
