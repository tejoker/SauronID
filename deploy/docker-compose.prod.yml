# Production-shaped compose template. This intentionally has no default secrets.
# Use a secret manager or environment injection in real deployments.
services:
  backend:
    # Context is the repo root: core's manifest has a path dependency on
    # transparent-zk/types. See the comment at the top of core/Dockerfile.
    build:
      context: ..
      dockerfile: core/Dockerfile
    image: sauronid-backend:${SAURONID_IMAGE_TAG:-latest}
    ports:
      - "${SAURONID_BACKEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - ENV=production
      - DATABASE_PATH=${DATABASE_PATH:?DATABASE_PATH is required}
      - SAURON_ACCEPT_SINGLE_NODE_SQLITE=${SAURON_ACCEPT_SINGLE_NODE_SQLITE:?acknowledge SQLite or replace the data tier}
      - SAURON_ALLOWED_ORIGINS=${SAURON_ALLOWED_ORIGINS:?SAURON_ALLOWED_ORIGINS is required}
      - SAURON_ADMIN_KEY=${SAURON_ADMIN_KEY:?SAURON_ADMIN_KEY is required}
      - SAURON_ADMIN_JWT_HS256_SECRET=${SAURON_ADMIN_JWT_HS256_SECRET:?SAURON_ADMIN_JWT_HS256_SECRET is required}
      - SAURON_TOKEN_SECRET=${SAURON_TOKEN_SECRET:?SAURON_TOKEN_SECRET is required}
      - SAURON_JWT_SECRET=${SAURON_JWT_SECRET:?SAURON_JWT_SECRET is required}
      - SAURON_OPRF_SEED=${SAURON_OPRF_SEED:?SAURON_OPRF_SEED is required}
      - SAURON_AUDIT_HMAC_KEY=${SAURON_AUDIT_HMAC_KEY:?SAURON_AUDIT_HMAC_KEY is required}
      # Real external timestamping; the mock provider makes production health fail.
      - SAURON_BITCOIN_ANCHOR_PROVIDER=${SAURON_BITCOIN_ANCHOR_PROVIDER:-opentimestamps}
      - SAURON_OTS_CALENDARS=${SAURON_OTS_CALENDARS:-https://alice.btc.calendar.opentimestamps.org,https://bob.btc.calendar.opentimestamps.org}
      - SAURON_ISSUER_URLS=${SAURON_ISSUER_URLS:-http://zkp-issuer:4000}
      - SAURON_ISSUER_SHARED_SECRET=${SAURON_ISSUER_SHARED_SECRET:?SAURON_ISSUER_SHARED_SECRET is required}
      # Sprint 1 — advisory → enforce flip. ENV=production already
      # implies fail-closed defaults; the lines below pin the gates
      # explicitly so a future env-template change can't silently
      # downgrade a running deployment to advisory mode.
      #
      # SAURON_REQUIRE_CALL_SIG=1
      #   Per-call DPoP-style signature is MANDATORY. Missing / invalid
      #   signature → 401. Disable only behind an explicit
      #   SAURON_UNSAFE_ALLOW_ADVISORY_IN_PROD=1 migration window.
      - SAURON_REQUIRE_CALL_SIG=${SAURON_REQUIRE_CALL_SIG:-1}
      # SAURON_REQUIRE_AGENT_TYPE=1
      #   /agent/register MUST receive `agent_type` + `checksum_inputs`
      #   so the server computes the integrity digest. Legacy
      #   operator-supplied checksums are rejected.
      - SAURON_REQUIRE_AGENT_TYPE=${SAURON_REQUIRE_AGENT_TYPE:-1}
      # SAURON_POLICY_ENFORCEMENT_MODE=enforce
      #   Bound policy denies at /agent/payment/authorize (and other
      #   action endpoints) short-circuit with 403. `advisory` (log
      #   only) and `off` (skip) are dev-only.
      - SAURON_POLICY_ENFORCEMENT_MODE=${SAURON_POLICY_ENFORCEMENT_MODE:-enforce}
      - SAURON_POLICY_REQUIRE_BINDING=${SAURON_POLICY_REQUIRE_BINDING:-1}
      - SAURON_EGRESS_GATEWAY=${SAURON_EGRESS_GATEWAY:-1}
      # Mandatory global damage ceiling even if a tenant policy is accidentally broad.
      - SAURON_MAX_ACTION_USD=${SAURON_MAX_ACTION_USD:?SAURON_MAX_ACTION_USD is required}
      # Agents are treated as hostile; hardware evidence is optional and is not
      # a root of policy enforcement. Set both flags to 1 plus a golden list only
      # when selling a separately validated TPM/Nitro assurance tier.
      - SAURON_REQUIRE_HARDWARE_ATTESTATION=${SAURON_REQUIRE_HARDWARE_ATTESTATION:-0}
      - SAURON_REQUIRE_PREREGISTERED_MEASUREMENT=${SAURON_REQUIRE_PREREGISTERED_MEASUREMENT:-0}
      - SAURON_ATTESTATION_GOLDEN_MEASUREMENTS=${SAURON_ATTESTATION_GOLDEN_MEASUREMENTS:-}
      # Pinned reviewed guest programs for native, ceremony-free STARK receipts.
      - SAURON_TRANSPARENT_IMAGE_IDS_JSON=${SAURON_TRANSPARENT_IMAGE_IDS_JSON:?pinned transparent guest image IDs are required}
      - SAURON_ENFORCE_STATS_FRESHNESS=${SAURON_ENFORCE_STATS_FRESHNESS:-1}
      # Unreviewed/legacy protocol surfaces remain fail-closed.
      - SAURON_ENABLE_LEGACY_OPRF=0
      - SAURON_ENABLE_LEGACY_OPRF_AUTH=0
      - SAURON_ENABLE_VOLUNTARY_EGRESS_LOG=0
      - SAURON_ENABLE_LEGACY_TOKEN_MAC=0
      - SAURON_ENABLE_GROTH16=0
      - SAURON_ENABLE_KYC_GROTH16=0
      - SAURON_ANON_RINGS=0
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    image: sauronid-dashboard:${SAURONID_IMAGE_TAG:-latest}
    ports:
      - "${SAURONID_DASHBOARD_PORT:-3000}:3000"
    environment:
      - SAURON_CORE_INTERNAL_URL=${SAURON_CORE_INTERNAL_URL:-http://backend:3001}
      - SAURON_ADMIN_KEY=${SAURON_ADMIN_KEY:?SAURON_ADMIN_KEY is required}
      - SAURON_ADMIN_JWT_HS256_SECRET=${SAURON_ADMIN_JWT_HS256_SECRET:?SAURON_ADMIN_JWT_HS256_SECRET is required}
      - SAURON_DASHBOARD_SESSION_SECRET=${SAURON_DASHBOARD_SESSION_SECRET:?SAURON_DASHBOARD_SESSION_SECRET is required}
      - SAURON_DASHBOARD_OPERATORS=${SAURON_DASHBOARD_OPERATORS:?SAURON_DASHBOARD_OPERATORS is required}
    depends_on:
      - backend
    restart: unless-stopped
