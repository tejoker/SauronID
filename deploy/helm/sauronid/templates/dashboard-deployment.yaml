apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sauronid.fullname" . }}-dashboard
  labels:
    {{- include "sauronid.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sauronid.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sauronid.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}{{ if .Values.dashboard.image.digest }}@{{ .Values.dashboard.image.digest }}{{ else }}:{{ .Values.dashboard.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "sauronid.secretName" . }}
          env:
            - name: PORT
              value: "3000"
            - name: SAURON_CORE_INTERNAL_URL
              value: "http://{{ include "sauronid.fullname" . }}-core:{{ .Values.core.service.port }}"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
