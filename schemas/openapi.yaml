      operationId: adminRecentEgress
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: limit, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Egress log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, agent_id, target_host, target_path, method, status_code, ts, allowed]
                  properties:
                    id: { type: integer, format: int64 }
                    agent_id: { type: string }
                    target_host: { type: string }
                    target_path: { type: string }
                    method: { type: string }
                    status_code: { type: integer, format: int64 }
                    ts: { type: integer, format: int64 }
                    allowed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/checksum/audit/{agent_id}:
    get:
      tags: [admin]
      summary: Checksum rotation audit for an agent
      operationId: adminChecksumAudit
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rotation history.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [from_checksum, to_checksum, reason, actor, ts]
                  properties:
                    from_checksum: { type: string }
                    to_checksum: { type: string }
                    reason: { type: string }
                    actor: { type: string }
                    ts: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/health/detailed:
    get:
      tags: [admin]
      summary: Detailed operator health report
      operationId: adminHealthDetailed
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Structured health.
          content:
            application/json:
              schema:
                type: object
                required: [ok, runtime, call_sig_enforce, require_agent_type, require_hardware_attestation, require_preregistered_measurement, policy_require_binding, egress_gateway_enabled, policy_enforcement_mode, bitcoin_anchor, solana_anchor, database, audit, feature_flags, warnings]
                properties:
                  ok: { type: boolean }
                  runtime: { type: string }
                  call_sig_enforce: { type: boolean }
                  require_agent_type: { type: boolean }
                  require_hardware_attestation: { type: boolean }
                  require_preregistered_measurement: { type: boolean }
                  policy_require_binding: { type: boolean }
                  egress_gateway_enabled: { type: boolean }
                  global_max_action_usd: { type: [number, "null"] }
                  policy_enforcement_mode: { type: string }
                  bitcoin_anchor: &healthComponent
                    type: object
                    required: [ok, detail]
                    properties:
                      ok: { type: boolean }
                      detail: { type: string }
                  solana_anchor: *healthComponent
                  database: *healthComponent
                  audit: *healthComponent
                  feature_flags:
                    type: object
                    required: [bank_kyc_enabled, user_kyc_enabled, zkp_issuer_enabled, compliance_enabled]
                    properties:
                      bank_kyc_enabled: { type: boolean }
                      user_kyc_enabled: { type: boolean }
                      zkp_issuer_enabled: { type: boolean }
                      compliance_enabled: { type: boolean }
                  warnings: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/rings:
    post:
      tags: [admin]
      summary: Create or update an anonymous ring rule
      description: Also gated by SAURON_ANON_RINGS.
      operationId: adminCreateRing
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            # TODO-refine: RingRule shape (core/src/rings.rs)
            schema:
              type: object
              required: [ring_id]
              properties:
                ring_id: { type: string }
                tenant_id: { type: string, default: default }
                rule: { type: object, additionalProperties: true, description: RingRule (private policy for the ring). }
      responses:
        '200':
          description: Ring stored.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ring_id, tenant_id]
                properties:
                  ok: { type: boolean, const: true }
                  ring_id: { type: string }
                  tenant_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [admin]
      summary: List rings with member counts
      operationId: adminListRings
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: tenant_id, in: query, required: false, schema: { type: string, default: default } }
      responses:
        '200':
          description: Rings.
          content:
            application/json:
              # TODO-refine: rule shape
              schema:
                type: object
                required: [rings]
                properties:
                  rings:
                    type: array
                    items:
                      type: object
                      properties:
                        ring_id: { type: string }
                        rule: { type: object, additionalProperties: true }
                        version: { type: integer }
                        member_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/rings/{ring_id}/subscribe:
    post:
      tags: [admin]
      summary: Add an agent pseudonym to a ring
      operationId: adminRingSubscribe
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: ring_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: [string, "null"] }
                agent_public_hex: { type: [string, "null"] }
                tenant_id: { type: string, default: default }
      responses:
        '200':
          description: Member added.
          content:
            application/json:
              schema:
                type: object
                required: [ring_id, member_point_hex]
                properties:
                  ring_id: { type: string }
                  member_point_hex: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rings/{ring_id}/revoke:
    post:
      tags: [admin]
      summary: Remove an agent pseudonym from a ring
      operationId: adminRingRevoke
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: ring_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: [string, "null"] }
                agent_public_hex: { type: [string, "null"] }
                tenant_id: { type: string, default: default }
      responses:
        '200':
          description: Membership revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ring_id, revoked]
                properties:
                  ring_id: { type: string }
                  revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rings/{ring_id}/members:
    get:
      tags: [admin]
      summary: List ring member points
      operationId: adminRingMembers
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: ring_id, in: path, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, required: false, schema: { type: string, default: default } }
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [ring_id, count, members]
                properties:
                  ring_id: { type: string }
                  count: { type: integer }
                  members: { type: array, items: { type: string, description: Member point hex. } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rings/{ring_id}/usage:
    get:
      tags: [admin]
      summary: Per-pseudonym token usage for a ring
      operationId: adminRingUsage
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: ring_id, in: path, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, required: false, schema: { type: string, default: default } }
      responses:
        '200':
          description: Usage per pseudonym.
          content:
            application/json:
              schema:
                type: object
                required: [ring_id, pseudonyms]
                properties:
                  ring_id: { type: string }
                  pseudonyms:
                    type: array
                    items:
                      type: object
                      properties:
                        key_image_hex: { type: string }
                        input_tokens: { type: integer, format: int64 }
                        output_tokens: { type: integer, format: int64 }
                        usd: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── /v1/policy (admin-gated) ──

  /v1/policy/upload:
    post:
      tags: [v1-policy]
      summary: Upload a policy (YAML)
      description: Accepts JSON `{raw_yaml}` or a raw YAML body with Content-Type application/yaml.
      operationId: policyUpload
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [raw_yaml]
              properties:
                raw_yaml: { type: string }
          application/yaml:
            schema: { type: string }
      responses:
        '200':
          description: Policy compiled and stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy_id, agent, checks]
                properties:
                  policy_id: { type: string, description: pol_<32-hex>. }
                  agent: { type: string }
                  checks: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/policy/list:
    get:
      tags: [v1-policy]
      summary: List stored policies
      operationId: policyList
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Policy summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [policy_id, agent, version, updated_at]
                  properties:
                    policy_id: { type: string }
                    agent: { type: string }
                    version: { type: string }
                    updated_at: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/policy/evaluate:
    post:
      tags: [v1-policy]
      summary: Evaluate an action against a policy
      description: >-
        If `agent_id` is present the server-authoritative spend ledger is
        consulted; otherwise simulator context overrides apply and the
        response is flagged `simulator: true`.
      operationId: policyEvaluate
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_id, action]
              properties:
                policy_id: { type: string }
                agent_id: { type: [string, "null"] }
                action: { $ref: '#/components/schemas/PolicyAction' }
                context_overrides:
                  type: [object, "null"]
                  additionalProperties: false
                  properties:
                    spend_total_usd: { type: [number, "null"] }
                    recent_call_timestamps:
                      oneOf:
                        - type: array
                          items: { type: integer, format: int64 }
                        - type: "null"
                    now_tz_hhmm: { type: [string, "null"] }
                    now_epoch: { type: [integer, "null"] }
      responses:
        '200':
          description: Verdict with per-check trace.
          content:
            application/json:
              schema:
                type: object
                required: [verdict, trace, spend_total_usd]
                properties:
                  verdict: { $ref: '#/components/schemas/Verdict' }
                  trace:
                    type: array
                    items:
                      type: object
                      required: [check, verdict]
                      properties:
                        check: { type: string }
                        verdict: { $ref: '#/components/schemas/Verdict' }
                  spend_total_usd: { type: number }
                  simulator: { type: boolean, description: Present only when true. }
                  simulator_warning: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/policy/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [v1-policy]
      summary: Fetch a compiled policy AST
      operationId: policyGetOne
      security: [{ adminKey: [] }, { adminJwt: [] }]
      responses:
        '200':
          description: Full compiled Policy AST (core/src/policy/ast.rs).
          content:
            application/json:
              # TODO-refine: Policy AST schema
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [v1-policy]
      summary: Delete a policy
      operationId: policyDeleteOne
      security: [{ adminKey: [] }, { adminJwt: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── /v1/agents (admin-gated spend ledger + policy binding) ──

  /v1/agents/{agent_id}/spend:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: agent_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [v1-agents]
      summary: Record spend against an agent's policy period
      operationId: recordSpend
      security: [{ adminKey: [] }, { adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_id, amount_usd]
              properties:
                policy_id: { type: string }
                action_id: { type: [string, "null"] }
                amount_usd: { type: number, minimum: 0, maximum: 1000000, description: "Capped at MAX_SPEND_RECORD_USD (1,000,000)." }
      responses:
        '200':
          description: Spend recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [log_id, new_total_usd]
                properties:
                  log_id: { type: string }
                  new_total_usd: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [v1-agents]
      summary: Get the spend summary for an agent and policy
      operationId: getSpend
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - { name: policy_id, in: query, required: true, schema: { type: string } }
        - { name: period_start, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Spend summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy_id, agent_id, period_start, total_usd, last_updated, log_count]
                properties:
                  policy_id: { type: string }
                  agent_id: { type: string }
                  period_start: { type: integer, format: int64 }
                  total_usd: { type: number }
                  last_updated: { type: integer, format: int64 }
                  log_count: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/agents/{agent_id}/spend/log:
    get:
      tags: [v1-agents]
      summary: List spend log entries
      operationId: listSpendLog
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: policy_id, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, format: int64, default: 100, maximum: 1000 } }
      responses:
        '200':
          description: Log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [log_id, policy_id, agent_id, action_id, amount_usd, recorded_at, source]
                  properties:
                    log_id: { type: string }
                    policy_id: { type: string }
                    agent_id: { type: string }
                    action_id: { type: [string, "null"] }
                    amount_usd: { type: number }
                    recorded_at: { type: integer, format: int64 }
                    source: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/agents/{agent_id}/policy_binding:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: agent_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [v1-agents]
      summary: Bind a policy to an agent
      operationId: bindPolicy
      security: [{ adminKey: [] }, { adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_id]
              properties:
                policy_id: { type: string }
      responses:
        '200':
          description: Binding record.
          content:
            application/json:
              schema: &policyBindingRecord
                type: object
                additionalProperties: false
                required: [agent_id, policy_id, bound_at]
                properties:
                  agent_id: { type: string }
                  policy_id: { type: string }
                  bound_at: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [v1-agents]
      summary: Get the agent's policy binding
      operationId: getPolicyBinding
      security: [{ adminKey: [] }, { adminJwt: [] }]
      responses:
        '200':
          description: Binding record.
          content:
            application/json:
              schema: *policyBindingRecord
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [v1-agents]
      summary: Unbind the agent's policy (idempotent)
      operationId: unbindPolicy
      security: [{ adminKey: [] }, { adminJwt: [] }]
      responses:
        '200':
          description: Unbound.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unbound]
                properties:
                  unbound: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── /v1/proofs (admin-gated) ──

  /v1/proofs/action-log/verify:
    post:
      tags: [v1-proofs]
      summary: Verify a Groth16 action-log proof against a checkpoint
      description: >-
        The server resolves the merkle root/size/anchor from checkpoint_id;
        caller-supplied roots are ignored. Returns a bare status code (200 on
        accept) with no body.
      operationId: actionLogVerify
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ActionLogProofPayload flattened plus checkpoint_id.
              required: [circuit, public_inputs, proof_b64, vk_id, checkpoint_id]
              properties:
                circuit: { type: string }
                public_inputs: { type: array, items: { type: string }, description: "snarkjs public signals, base-10 strings." }
                proof_b64: { type: string, description: base64 Groth16 proof JSON. }
                vk_id: { type: string }
                checkpoint_id: { type: string }
      responses:
        '200': { description: Proof accepted (empty body). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/proofs/transparent/verify:
    post:
      tags: [v1-proofs]
      summary: Verify a transparent (RISC-Zero) proof against a checkpoint
      operationId: transparentVerify
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: TransparentProofPayload flattened plus checkpoint_id.
              required: [checkpoint_id, program_id, receipt_b64]
              properties:
                checkpoint_id: { type: string }
                program_id: { type: string }
                receipt_b64: { type: string }
      responses:
        '200':
          description: Verification result with the decoded journal.
          content:
            application/json:
              schema:
                type: object
                required: [valid, journal]
                properties:
                  valid: { type: boolean }
                  journal: { $ref: '#/components/schemas/TransparentJournal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/proofs/checkpoint/finalize:
    post:
      tags: [v1-proofs]
      summary: Finalize a proof checkpoint for a circuit and anchor
      description: >-
        Allowed circuits: StatsHonestComputation, TransparentActionPolicy,
        ActionRangeProof, ActionTimeWindow, ActionSetMembership,
        ActionSetNonMembership, ActionSumBound, ActionCountInRange.
      operationId: finalizeProofCheckpoint
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [circuit, action_anchor_id]
              properties:
                circuit: { type: string }
                action_anchor_id: { type: string }
      responses:
        '200':
          description: Checkpoint finalized.
          content:
            application/json:
              schema:
                type: object
                required: [checkpoint_id, anchor_id, finalized, statement_commitment_hex]
                properties:
                  checkpoint_id: { type: string }
                  anchor_id: { type: string }
                  finalized: { type: boolean }
                  statement_commitment_hex: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── /v1/stats (admin-gated) ──

  /v1/stats/submit:
    post:
      tags: [v1-stats]
      summary: Submit a claimed metric value with a Groth16 integrity proof
      operationId: statsSubmit
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatsSubmission' }
      responses:
        '200':
          description: Stored after proof verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSubmitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/stats/submit-transparent:
    post:
      tags: [v1-stats]
      summary: Submit a claimed metric value with a transparent (RISC-Zero) proof
      operationId: statsSubmitTransparent
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: TransparentStatsSubmission (TransparentProofPayload flattened).
              required: [metric_id, claimed_value, period_start, period_end, checkpoint_id, program_id, receipt_b64]
              properties:
                tenant_id: { type: string, default: "" }
                agent_id_or_none: { type: [string, "null"] }
                metric_id: { type: string, enum: [success_rate, error_rate, tool_call_count, cost_total] }
                claimed_value: { type: integer, format: int64 }
                period_start: { type: integer, format: int64 }
                period_end: { type: integer, format: int64 }
                checkpoint_id: { type: string }
                program_id: { type: string }
                receipt_b64: { type: string }
      responses:
        '200':
          description: Stored after proof verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSubmitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/stats/cohort:
    get:
      tags: [v1-stats]
      summary: Query raw verified stats rows for a metric and period
      operationId: statsCohortQuery
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: metric_id, in: query, required: true, schema: { type: string } }
        - { name: period_start, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: period_end, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Matching rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rows, n]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [tenant_id, metric_id, claimed_value, n_records, period_start, period_end, merkle_root, submitted_at]
                      properties:
                        tenant_id: { type: string }
                        agent_id_or_none: { type: [string, "null"] }
                        metric_id: { type: string }
                        claimed_value: { type: integer, format: int64 }
                        n_records: { type: integer, format: int64 }
                        period_start: { type: integer, format: int64 }
                        period_end: { type: integer, format: int64 }
                        merkle_root: { type: string }
                        submitted_at: { type: integer, format: int64 }
                  n: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── /v1/cohort (admin-gated, DP-published surface) ──

  /v1/cohort:
    post:
      tags: [v1-cohort]
      summary: Create or update a cohort definition
      operationId: cohortUpsert
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CohortDefinition' }
      responses:
        '200':
          description: Stored definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CohortDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [v1-cohort]
      summary: List cohort definitions
      operationId: cohortList
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Definitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CohortDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/cohort/published:
    get:
      tags: [v1-cohort]
      summary: Fetch the DP-published cohort for a period
      description: Laplace noise per quartile under the cohort's epsilon budget; metrics below the k-anonymity threshold are suppressed.
      operationId: cohortPublished
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: cohort_id, in: query, required: true, schema: { type: string } }
        - { name: period_start, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: period_end, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Published cohort.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedCohort' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cohort/{id}/budget:
    get:
      tags: [v1-cohort]
      summary: DP budget ledger for a cohort
      operationId: cohortBudgetGet
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ledger entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [cohort_id, metric_id, cycle_start, epsilon_spent, delta_spent, epsilon_cap, delta_cap, last_published]
                  properties:
                    cohort_id: { type: string }
                    metric_id: { type: string }
                    cycle_start: { type: integer, format: int64 }
                    epsilon_spent: { type: number }
                    delta_spent: { type: number }
                    epsilon_cap: { type: number }
                    delta_cap: { type: number }
                    last_published: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cohort/{id}/budget/rotate:
    post:
      tags: [v1-cohort]
      summary: Rotate the DP budget cycle for a cohort
      operationId: cohortBudgetRotate
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_cycle_start, new_epsilon_cap, new_delta_cap]
              properties:
                new_cycle_start: { type: integer, format: int64 }
                new_epsilon_cap: { type: number }
                new_delta_cap: { type: number }
                metric_ids:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: "null"
      responses:
        '200':
          description: Rotation result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cohort_id, new_cycle_start, rotated]
                properties:
                  cohort_id: { type: string }
                  new_cycle_start: { type: integer, format: int64 }
                  rotated: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cohort/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [v1-cohort]
      summary: Fetch a cohort definition
      operationId: cohortGet
      security: [{ adminKey: [] }, { adminJwt: [] }]
      responses:
        '200':
          description: Definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CohortDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [v1-cohort]
      summary: Delete a cohort definition
      operationId: cohortDelete
      security: [{ adminKey: [] }, { adminJwt: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── /v1/admin/audit (admin-gated, tenant-scoped security events) ──

  /v1/admin/audit:
    get:
      tags: [v1-audit]
      summary: Query the security audit log
      operationId: adminAuditQuery
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: since, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: until, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: event_type, in: query, required: false, schema: { type: string, enum: [auth_failed, signature_mismatch, cross_tenant_attempt, policy_violation, admin_key_rotated, rate_limit_tripped, egress_denied] } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: Audit records.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [audit_id, tenant_id, event_type, event, timestamp]
                  properties:
                    audit_id: { type: string }
                    tenant_id: { type: string }
                    event_type: { type: string }
                    event:
                      type: object
                      additionalProperties: true
                      description: >-
                        Internally tagged enum ("type"): auth_failed{ip,path,reason},
                        signature_mismatch{agent_id,path},
                        cross_tenant_attempt{tenant_id,target_tenant,path},
                        policy_violation{tenant_id,agent_id,policy_id,check,reason},
                        admin_key_rotated{key_fingerprint},
                        rate_limit_tripped{ip,path},
                        egress_denied{tenant_id,agent_id,host,method,path,reason}.
                    timestamp: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── /v1/audit (periodic ZK audit reports) ──

  /v1/audit/reports:
    post:
      tags: [v1-audit]
      summary: Generate a signed audit report for a period
      operationId: createAuditReport
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [period_start, period_end]
              properties:
                agent_ids:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: "null"
                period_start: { type: integer, format: int64 }
                period_end: { type: integer, format: int64 }
      responses:
        '200':
          description: Report plus detached signature.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [report, signature]
                properties:
                  report: { $ref: '#/components/schemas/AuditReport' }
                  signature: { type: string, description: hex HMAC-SHA256 over the report. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [v1-audit]
      summary: List stored audit reports
      operationId: listAuditReports
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        '200':
          description: Reports.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/audit/reports/{id}:
    get:
      tags: [v1-audit]
      summary: Fetch one audit report
      operationId: getAuditReport
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── /v1/attestation (admin-gated) ──

  /v1/attestation/nitro/verify:
    post:
      tags: [v1-attestation]
      summary: Verify an AWS Nitro attestation document
      description: >-
        Validates a raw COSE_Sign1 blob, surfaces the parsed module_id and
        PCRs, and checks the measurement against the operator-registered
        expected hash. Verification failures return 200 with valid=false and
        an error string; only malformed base64 returns 400.
      operationId: nitroVerify
      security: [{ adminKey: [] }, { adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attestation_blob_b64, expected_measurement_hash]
              properties:
                attestation_blob_b64: { type: string, description: base64 AWS Nitro COSE_Sign1 blob. }
                expected_measurement_hash: { type: string, description: Operator-registered measurement (hex). }
                agent_id: { type: [string, "null"], description: Optional; echoed back. }
      responses:
        '200':
          description: Verification result (also used for verification failures, with valid=false).
          content:
            application/json:
              schema:
                type: object
                required: [valid, module_id, pcrs, timestamp, error, agent_id]
                properties:
                  valid: { type: boolean }
                  module_id: { type: string }
                  pcrs:
                    type: object
                    additionalProperties: { type: string }
                    description: PCR index (stringified integer key) to hex SHA-384.
                  timestamp: { type: integer, minimum: 0 }
                  error: { type: [string, "null"], description: Set when valid is false. }
                  agent_id: { type: [string, "null"] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
