# DEV ONLY — one-command evaluator stack. From the repo root:
#
#     docker compose up
#
# Boots core (dev mode, SQLite on a named volume, port 3001), the dashboard
# (port 3000, dev/dev login), and a one-shot seed job that loads demo clients
# and users once core is healthy. No .env editing required; the admin key
# below is a fixed dev value and must never reach production.
#
# Production: deploy/docker-compose.prod.yml (no default secrets).
# Other scenarios (postgres, VM demo, systemd, helm, terraform): deploy/README.md.

services:
  backend:
    # Context is the repo root: core's manifest has a path dependency on
    # transparent-zk/types. See the comment at the top of core/Dockerfile.
    build:
      context: .
      dockerfile: core/Dockerfile
    image: sauronid-backend:dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ENV=development
      - DATABASE_PATH=/var/lib/sauronid/sauron.db
      - SAURON_ACCEPT_SINGLE_NODE_SQLITE=1
      - SAURON_ENABLE_DEV_ENDPOINTS=1
      # Fail closed by default, so what an evaluator sees is the product. With
      # this at 0 the call-signature layer is a no-op: an unsigned request gets
      # 200 and the same body as a signed one. Compose only forwards variables a
      # service declares, so without this line `SAURON_REQUIRE_CALL_SIG=1 docker
      # compose up` silently did nothing.
      - SAURON_REQUIRE_CALL_SIG=${SAURON_REQUIRE_CALL_SIG:-1}
      # Same limiter settings the release gate uses to run the 16-attack suite
      # (release-gate.yml): the suite is a deliberate localhost load generator and
      # trips the coarse per-IP limiter on setup. The per-endpoint register window
      # stays finite so scenario A12 still has a limit to hit.
      - SAURON_RISK_AGENT_REGISTER_PER_WINDOW=${SAURON_RISK_AGENT_REGISTER_PER_WINDOW:-60}
      - SAURON_GLOBAL_RATE_LIMIT_RPS=${SAURON_GLOBAL_RATE_LIMIT_RPS:-100000}
      - SAURON_GLOBAL_RATE_LIMIT_BURST=${SAURON_GLOBAL_RATE_LIMIT_BURST:-100000}
      # Real Bitcoin anchoring by default, via OpenTimestamps. This costs
      # nothing: the calendar aggregates thousands of digests into one
      # transaction it pays for, so a demo anchors for free and the receipt
      # upgrades into a real chain proof within roughly an hour. Set
      # SAURON_BITCOIN_ANCHOR_PROVIDER=mock to run offline (CI, no network) —
      # the mock writes a synthetic txid that is on no chain, and the Proofs page
      # now says so instead of claiming a Bitcoin commitment.
      - SAURON_BITCOIN_ANCHOR_PROVIDER=${SAURON_BITCOIN_ANCHOR_PROVIDER:-opentimestamps}
      - SAURON_BITCOIN_NETWORK=${SAURON_BITCOIN_NETWORK:-bitcoin}
      # 60s instead of the 10-minute default so a demo produces a real anchored
      # batch while someone is watching. The task only submits when there are
      # pending receipts, so an idle stack does not poll the calendars.
      - SAURON_ACTION_ANCHOR_INTERVAL_SECS=${SAURON_ACTION_ANCHOR_INTERVAL_SECS:-60}
      - SAURON_ADMIN_KEY=dev-only-admin-key-not-for-production
      # Dev only: dashboard counters and seed summary read deployment-global
      # admin views (/admin/stats), which tenant-scoped keys cannot.
      - SAURON_ADMIN_CROSS_TENANT=1
    volumes:
      - sauron_data:/var/lib/sauronid
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        # Baked at build time; the browser talks to core on localhost:3001.
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    image: sauronid-dashboard:dev
    ports:
      - "3000:3000"
    environment:
      - SAURON_CORE_INTERNAL_URL=http://backend:3001
      - SAURON_ADMIN_KEY=dev-only-admin-key-not-for-production
      # Dev-only login dev/dev. The standalone build runs NODE_ENV=production,
      # where the automatic dev-operator fallback is (correctly) disabled, so
      # the operator and session secret must be explicit. scrypt("dev").
      - SAURON_DASHBOARD_SESSION_SECRET=dev-only-session-secret-not-for-production
      - 'SAURON_DASHBOARD_OPERATORS={"dev":{"password_scrypt":"c2F1cm9uaWQtZGV2LXNhbHQtMTY=:nx/pN6DXQkVC3bEfD2XHjXYlzVhK3zVlKWqmf0prXOw=","tenants":["default"],"super":true}}'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # One-shot demo seed: runs core/seed.sh (baked into the core image) against
  # the backend, then exits. scripts/ is mounted so seed.sh can source
  # scripts/lib/dev_secrets.sh at /scripts/lib/dev_secrets.sh.
  seed:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: sauronid-backend:dev
    command: ["bash", "/app/seed.sh"]
    environment:
      - SAURON_URL=http://backend:3001
      - SAURON_ADMIN_KEY=dev-only-admin-key-not-for-production
      # Throwaway owner keys for the seeded demo users. Written into the data
      # volume, which the image already chowns to the runtime user — a host bind
      # mount is owned by the host user and the container (uid 10001) cannot
      # write to it. Copy them out with:
      #   docker compose exec -T backend cat /var/lib/sauronid/demo-owner-keys.json
      - SAURON_DEMO_OWNER_KEYS=/var/lib/sauronid/demo-owner-keys.json
    volumes:
      - ./scripts:/scripts:ro
      - sauron_data:/var/lib/sauronid
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  sauron_data:
