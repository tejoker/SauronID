[project]
name = "sauronid-client"
version = "0.2.0"
description = "SauronID Python client + LangChain/OpenAI/Anthropic/LlamaIndex/CrewAI/AutoGen adapters for AI-agent binding."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SauronID maintainers" }]
keywords = ["ai-agent", "auth", "binding", "dpop", "anthropic", "openai", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
]

# All adapters are duck-typed: none of these packages is required at
# runtime. The extras exist so `pip install 'sauronid-client[crewai]'`
# pulls the matching framework in one step.
[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
llamaindex = ["llama-index-core>=0.10"]
crewai = ["crewai>=0.28"]
autogen = ["pyautogen>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]

[project.urls]
"Homepage" = "https://github.com/tejoker/SauronID"
"Repository" = "https://github.com/tejoker/SauronID"
"Documentation" = "https://github.com/tejoker/SauronID/tree/main/docs"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sauronid_client*"]

[tool.setuptools.package-data]
# Platform wheels bundle the Rust agent-action-tool binary (built in release
# CI per target); sdists and dev checkouts fall back to env/PATH/repo lookup.
sauronid_client = ["_bin/agent-action-tool", "_bin/agent-action-tool.exe"]
