[package]
name = "sauron-core"
version = "0.2.0"
edition = "2021"
# Proprietary: the gateway is the product. See core/LICENSE and the map in
# ../LICENSE. `publish = false` is not just hygiene — cargo-deny's licence check
# walks workspace members too, and [licenses.private] ignore lets it skip crates
# that are never published rather than demanding a licence from its allowlist.
license-file = "LICENSE"
publish = false
default-run = "sauron-core"

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core", "serde"] }
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10"   # maintained drop-in for the unsound/unmaintained serde_yml+libyml (RUSTSEC-2025-0067/0068)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
regex = "1"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
hex = "0.4.3"
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
prometheus = { version = "0.13", default-features = false }
once_cell = "1.19"
bs58 = "0.5"
# `tls-rustls-ring-native-roots`, NOT the `runtime-tokio-rustls` bundle: that
# bundle resolves to webpki-roots, i.e. Mozilla's baked-in CA list, while the
# blocking pool in `db.rs` reads the platform trust store. Two pools to the same
# database with two different notions of who to trust means a private or
# enterprise CA — the normal case for managed and internal Postgres — makes one
# pool connect and the other fail. Both now read the system store.
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
# BLOCKING Postgres driver, deliberately not sqlx: the 277 direct call sites are
# sync code inside async handlers, and moving them to sqlx means rewriting each
# function and its callers as async. See core/src/any_db.rs.
postgres = "0.19"
r2d2_postgres = "0.18"
rs_merkle = "1.4"
hmac = "0.12"
hkdf = "0.12"
subtle = "2.6"
jsonwebtoken = "9.3"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# Transparent production proof verifier.  We deliberately compile the verifier
# without prover/Bonsai features and with dev-mode disabled.  The application
# additionally rejects Groth16 and Fake receipt variants at the wire boundary;
# only native RISC Zero Succinct STARK receipts are accepted.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["disable-dev-mode"] }
# The version is required: a bare path dependency reads as `version = "*"`, and
# deny.toml sets `wildcards = "deny"`.
sauron-transparent-types = { path = "../transparent-zk/types", version = "0.1.0" }
# TLS for the BLOCKING Postgres pool. The pool was built with `postgres::NoTls`
# hardcoded, so on a managed provider the link either refused to come up or ran
# in cleartext — carrying owner mandates, receipts and session material. rustls
# rather than native-tls: the tree is already all-rustls (sqlx, reqwest), and
# native-tls wants a system OpenSSL in the runtime image.
# `native-certs` reads the platform trust store; `ring` matches the provider
# installed in `db::open_pg_pool` and keeps aws-lc-rs (and its C toolchain) out.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"] }
# Direct dependency only to install the process-wide crypto provider that
# `tokio-postgres-rustls` requires and does not install itself. `tls12` is kept:
# without it this is TLS 1.3-only, and managed Postgres endpoints still
# negotiate 1.2.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }

[profile.release]
# Strip the symbol table from shipped binaries. Cargo does not do this by
# default: a release build carries no DWARF, but .symtab still names every
# function, so `nm` on the published image listed 2,376 sauron_core symbols —
# policy::invariants::daily_budget::DailyBudgetCheck,
# policy::invariants::pii_detection::PiiDetectionCheck and the rest. That is not
# source, but it is a labelled map of the engine's internals handed to anyone who
# pulls the container.
#
# "symbols" removes the symbol table and any debug info. Panics still unwind and
# the catch-panic middleware still works; only the symbolised backtrace is lost,
# which is an acceptable trade for a binary distributed to customers — the
# structured audit log, not a stack trace, is how failures are diagnosed here.
strip = "symbols"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Collecting a response body in tests. axum re-exports the trait but not the
# crate, and `tests/pool_exhaustion_503.rs` asserts on the error envelope.
http-body-util = "0.1"

[features]
default = []
