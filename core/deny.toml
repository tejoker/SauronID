# cargo-deny configuration for sauron-core.
#
# Run locally with:
#   cargo install --locked cargo-deny
#   cargo deny --manifest-path core/Cargo.toml check
#
# Three checks are enabled by default in CI: advisories, bans, licenses.

[graph]
# Restrict the dependency graph audit to the target we actually ship.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[advisories]
# Source of CVE/advisory data.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Fail the build on any known vulnerability or unmaintained crate.
yanked = "deny"
# The same two exceptions core/.cargo/audit.toml carries for cargo-audit: both
# are unmaintained-macro-crate notices, not vulnerability or unsoundness
# advisories, and neither can be removed without replacing the pinned RISC Zero
# 3.0.5 verifier. Every other advisory stays release-blocking. Remove these as
# soon as upstream does.
ignore = [
    "RUSTSEC-2024-0388", # derivative, through risc0-groth16/Arkworks
    "RUSTSEC-2024-0436", # paste, through risc0-zkvm/Arkworks
]

[licenses]
# Allow only OSI-approved, GPL-compatible permissive licenses for a
# commercial-friendly binary. Anything copyleft or unknown breaks the build
# and forces an explicit decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    # webpki-roots (0.26 via sqlx-postgres, 1.0 via rustls). This is the Mozilla
    # CA root bundle, not code: a permissive data licence with no copyleft or
    # attribution obligation on the binary.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

# The allowlist above governs DEPENDENCIES. sauron-core itself is BUSL-1.1
# (core/LICENSE) and never published to a registry, so it is skipped rather than
# being forced to declare one of the permissive licences a dependency must use.
# BUSL is not on the allowlist by design: it is the right licence for the thing
# we sell and the wrong one to inherit from a dependency.
[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# webpki 0.22 ships no `license` field in its manifest; the crate is ISC
# (LICENSE in the crate root). Newer webpki/rustls-webpki declare it properly.
[[licenses.clarify]]
name = "webpki"
version = "0.22.4"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

[bans]
# Detect multiple versions of the same crate (bloats the binary, slows builds,
# can mask CVEs by pinning an old transitive). Warn-only initially; flip to
# "deny" once duplicates are squashed.
multiple-versions = "warn"
wildcards = "deny"           # forbids `version = "*"` in Cargo.toml
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
