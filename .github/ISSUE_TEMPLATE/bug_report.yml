name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make demo
        2. ...
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: core / sdk/typescript / sdk/python / sdk/go / dashboard / site
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Rust/Node/Python version, SQLite or Postgres backend
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
