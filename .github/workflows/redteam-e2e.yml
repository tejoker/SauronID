name: KYA E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kya-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No job-level SAURON_ADMIN_KEY: a job-level `env` entry WINS over anything a
    # step writes to $GITHUB_ENV, so declaring it as "" here pinned it empty for
    # every step. compose then hit `${SAURON_ADMIN_KEY:?...}` (which fires on
    # empty as well as unset) and died in under a second. The key is generated in
    # the first step below.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate per-run admin key + issuer seed
        run: |
          KEY="$(openssl rand -hex 32)"
          ISSUER="$(openssl rand -hex 32)"
          echo "SAURON_ADMIN_KEY=${KEY}" >> "$GITHUB_ENV"
          # compose interpolation reads .env from the PROJECT directory, which for
          # `-f deploy/docker-compose.yml` is deploy/, not the repo root.
          {
            echo "SAURON_ADMIN_KEY=${KEY}"
            echo "ISSUER_SEED=${ISSUER}"
          } > deploy/.env

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Start backend via docker-compose
        # `zkp-issuer` used to be a service here; it was deleted with the banking
        # surface in 263fc0c and never removed from this step, so compose exited
        # with "no such service" and this job failed instantly on every run.
        run: |
          # Surface the failure as an annotation: a bare non-zero exit here shows
          # up as "Process completed with exit code 1" and nothing else, which
          # cost several blind round-trips.
          if ! cfg=$(ENV=development docker compose -f deploy/docker-compose.yml config 2>&1); then
            echo "::error title=compose config failed::${cfg//$'\n'/ | }"
            exit 1
          fi
          if ! out=$(ENV=development docker compose -f deploy/docker-compose.yml up -d backend 2>&1); then
            echo "::error title=compose up failed::${out//$'\n'/ | }"
            exit 1
          fi
          echo "$out"

      - name: Wait for backend health
        # /healthz, not /admin/stats: that view is deployment-global and 401s
        # unless the key is a cross-tenant super-admin.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/healthz >/dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend not healthy" >&2
          docker compose -f deploy/docker-compose.yml logs backend || true
          exit 1

      # The ZKP issuer service went with the banking surface in 263fc0c and was
      # never replaced (core/src/issuer_runtime.rs is a client, not a server), so
      # the KYA/ZKP e2e scripts that call zkp_require_issuer cannot run. They are
      # untracked rather than deleted — see .gitignore — and restorable from git
      # history if KYC/ZKP comes back with a customer attached.

      # The e2e signs its own calls now (default-deny across /agent/*), which
      # needs agent-action-tool built — hence the toolchain here.
      - name: Setup Rust for the e2e signer
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1

      - name: Cache cargo for the e2e signer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-e2e-signer-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-e2e-signer-${{ runner.os }}-

      # Built explicitly, not implicitly inside the test. ensure_agent_action_tool
      # would compile it on first use, so a build failure surfaced as "the e2e
      # failed" with no indication that nothing had been tested yet.
      - name: Build the e2e signer
        working-directory: core
        run: cargo build --locked --bin agent-action-tool

      - name: Run strict agent payment authorization e2e
        env:
          API_URL: http://localhost:3001
        run: |
          # Read the key from deploy/.env, written by the generate step in this
          # same job, rather than relying on $GITHUB_ENV propagation: the script
          # calls require_admin_key and exits in under a second without it,
          # which is indistinguishable in the UI from a failed assertion.
          set -a; . deploy/.env; set +a
          echo "admin key present: ${SAURON_ADMIN_KEY:+yes}"
          bash core/tests/e2e_agent_payment_authorize.sh

      - name: Setup Node for agentic
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Agentic unit tests + live shim integration
        working-directory: sdk/typescript
        env:
          SAURON_CORE_URL: http://localhost:3001
        run: |
          npm ci
          npm test
          npm run test:integration

      - name: KYA red-team (scripted invariants)
        working-directory: redteam
        env:
          SAURON_CORE_URL: http://localhost:3001
        run: |
          npm ci
          npm run redteam

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs backend || true

      - name: Shutdown stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans
