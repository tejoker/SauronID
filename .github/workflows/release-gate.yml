name: Release Gate

on:
  workflow_call:
  push:
    branches: [main, pocv1]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: false

      - name: Rust tests
        working-directory: core
        run: cargo test --locked

      - name: Rust clippy
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust formatting
        working-directory: core
        run: cargo fmt --all -- --check

      - name: OpenAPI spec matches the router
        run: python3 scripts/ci/check-openapi-routes.py

      - name: Docker build contexts
        run: bash scripts/ci/verify-docker-contexts.sh

      - name: Release metadata (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/ci/verify-release-metadata.sh "${GITHUB_REF_NAME}"

      - name: Rust dependency audit (cargo-audit)
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          bash scripts/ci/audit-rust.sh

      - name: JavaScript dependency audits
        run: bash scripts/ci/audit-npm.sh

      # Downloads toolchains from RISC Zero's servers, so it fails on a bad
      # network minute rather than a bad commit — it passed on the previous run
      # and failed on the next with no relevant change. Retried rather than left
      # to chance, because a flaky gate teaches people to ignore red.
      - name: Install pinned RISC Zero guest toolchain
        run: |
          cargo install rzup --version 0.5.2 --locked --no-default-features --features cli,install
          for target in "rust 1.97.0" "cargo-risczero 3.0.6"; do
            ok=0
            for attempt in 1 2 3; do
              # shellcheck disable=SC2086
              if rzup install $target; then ok=1; break; fi
              echo "rzup install $target failed (attempt $attempt/3); retrying in $((attempt * 15))s" >&2
              sleep $((attempt * 15))
            done
            [ "$ok" = 1 ] || { echo "rzup install $target failed after 3 attempts" >&2; exit 1; }
          done

      - name: Reproduce transparent guests and test customer verifier
        env:
          SAURON_TRANSPARENT_FULL_PROVE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash scripts/ci/verify-transparent-zk.sh

      - name: Agentic SDK
        working-directory: agentic
        run: |
          npm ci
          npm test
          npm run test:enforcement
          npm run test:stats

      - name: Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e clients/python pytest "pip-audit==2.10.1"
          python -m pytest clients/python/tests -q
          python -m pip_audit clients/python

      - name: SQLite clean-room backup and restore drill
        run: |
          python core/tests/sqlite_backup_restore.py

      - name: Go SDK
        working-directory: clients/go/sauronid
        run: |
          go test ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm test

      # zkp/scripts/audit_circuits.sh hard-exits when circom is absent, and no
      # step installed it — so this gate could only ever pass on a machine that
      # happened to have circom already. Pinned to a release binary and checked
      # against its digest rather than built from source, which takes minutes.
      - name: Install circom
        run: |
          curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  /usr/local/bin/circom" \
            | sha256sum -c -
          chmod +x /usr/local/bin/circom
          circom --version

      - name: ZKP circuit audit
        working-directory: zkp
        run: |
          npm ci
          npm test

      # REDUCED COVERAGE, stated on purpose. The Groth16 proving artifacts
      # (*.wasm, *_final.zkey) are build outputs and gitignored, so a checkout
      # cannot generate proofs — this step had never actually run. Generating
      # them here means downloading a large ptau and running a per-circuit
      # ceremony on every push, for the legacy Groth16 path that ships
      # feature-flagged off; the production proof path is transparent-zk, which
      # IS fully reproduced and verified above.
      #
      # So: the key-free tests (EdDSA, Poseidon Merkle tree, credential
      # construction) run, and the two proof tests print what they skipped. The
      # flag is required — without it the suite fails — so this cannot silently
      # decay into a no-op.
      - name: ZKP SDK (proof tests skipped — see note)
        working-directory: zkp/sdk
        env:
          ZKP_ALLOW_MISSING_ARTIFACTS: "1"
        run: |
          npm ci
          npm run build
          npm test

      - name: Dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm test -- --run
          npm run lint
          npm run build

      - name: Core dev leash smoke
        run: bash core/tests/smoke_dev_leash_demo.sh

      # Empirical 16-attack suite — boots the core, runs the adversarial harness,
      # fails the build on any pass→fail regression. The suite self-provisions
      # (registers its own client/agent), so no seed step is needed.
      - name: Empirical attack suite (live)
        working-directory: redteam
        env:
          SAURON_REQUIRE_CALL_SIG: "1"
          SAURON_CORE_URL: "http://127.0.0.1:3001"
          # Suite requires an explicit admin key; the server below is booted with
          # the same one so they match.
          SAURON_ADMIN_KEY: "ci_empirical_admin_key_0123456789abcdef"
        run: |
          # Never pass on a stale artifact from a previous run / crash.
          rm -f empirical-results.json
          # Boot core: fresh DB, call-sig enforced. Raise the GLOBAL (coarse,
          # per-IP) rate limiter so the harness's setup burst isn't throttled —
          # the suite exercises the specific PER-ENDPOINT risk limits via its own
          # env (A14/A15), which are unaffected by this.
          ( cd ../core && \
            ENV=development \
            SAURON_ENABLE_DEV_ENDPOINTS=1 \
            SAURON_ADMIN_KEY="$SAURON_ADMIN_KEY" \
            SAURON_REQUIRE_CALL_SIG=1 \
            SAURON_RISK_AGENT_REGISTER_PER_WINDOW=60 \
            SAURON_GLOBAL_RATE_LIMIT_RPS=100000 \
            SAURON_GLOBAL_RATE_LIMIT_BURST=100000 \
            DATABASE_PATH="${RUNNER_TEMP:-/tmp}/empirical.db" \
            PORT=3001 \
            cargo run --locked --release --bin sauron-core ) &
          CORE_PID=$!
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3001/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/health >/dev/null || { echo "core never came up"; kill "$CORE_PID"; exit 1; }
          npm ci
          npx tsx src/scenarios/empirical-suite.ts
          kill "$CORE_PID" || true
          # Freshness guard: a crashed run leaves no file — it MUST NOT pass.
          test -f empirical-results.json || { echo "empirical-results.json missing — suite did not complete"; exit 1; }
          PASS_COUNT=$(jq '.passed' empirical-results.json)
          TOTAL=$(jq '.total' empirical-results.json)
          DYNAMIC=$(jq '[.results[] | select(.dynamic == true)] | length' empirical-results.json)
          SKIPPED=$(jq '.skipped' empirical-results.json)
          if [ "$PASS_COUNT" != "$TOTAL" ] || [ "$TOTAL" -lt 16 ] || [ "$DYNAMIC" != "$TOTAL" ] || [ "$SKIPPED" != "0" ]; then
            echo "Empirical suite regression: $PASS_COUNT / $TOTAL"
            echo "Dynamic attack count: $DYNAMIC / $TOTAL; skipped: $SKIPPED"
            exit 1
          fi
          echo "Empirical suite OK: $PASS_COUNT / $TOTAL"

          # Stamp the run's identity INTO the evidence. The suite regenerates
          # this file on every push, but the result used to exist only inside an
          # expiring run log, so the only durable copy was the snapshot committed
          # to the repository — which is always older than the code it describes
          # and cannot say which commit it tested. A due-diligence pack needs a
          # file that dates itself.
          jq --arg sha "$GITHUB_SHA" \
             --arg ref "$GITHUB_REF" \
             --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             '. + {commit: $sha, ref: $ref, workflow_run: $run}' \
             empirical-results.json > empirical-results.stamped.json
          mv empirical-results.stamped.json empirical-results.json

      - name: Upload empirical evidence
        # if: always() so a FAILING suite is downloadable too. The failure detail
        # is the most useful artifact there is, and it is exactly the one that
        # used to vanish with the run log.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: empirical-results-${{ github.sha }}
          path: redteam/empirical-results.json
          if-no-files-found: warn
          retention-days: 90
