name: SBOM (CycloneDX)

# Generates a Software Bill of Materials for every language ecosystem in the
# repo. Runs on every GitHub release (so the SBOM gets attached to the
# release artifact) and weekly so a freshly published transitive dep is
# captured before the next release.

on:
  release:
    types: [published]
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

# `permissions: contents: write` is needed only for the release-upload step.
# All other steps are read-only.
permissions:
  contents: write

jobs:
  rust-sbom:
    name: Rust SBOM (cargo-cyclonedx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sbom-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}

      # cargo-cyclonedx is intentionally NOT a Cargo.toml dependency — it is
      # a CLI tool installed via `cargo install` for SBOM generation only.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate Rust SBOM
        working-directory: core
        run: cargo cyclonedx -f json --override-filename sbom-rust

      - name: Move SBOM to repo root
        run: |
          mkdir -p sbom-artifacts
          # cargo-cyclonedx may emit multiple files (one per crate) — gather all.
          find core -maxdepth 3 -name 'sbom-rust*.json' -exec cp {} sbom-artifacts/ \;

      - name: Upload Rust SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-rust
          path: sbom-artifacts/*.json
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: sbom-artifacts/*.json

  typescript-sbom:
    name: TypeScript SBOM (CycloneDX npm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Adjust to match the actual subdirs that ship `package.json`.
        # clients/python is a Python package and is handled by the python-sbom job.
        subdir:
          - dashboard
          - agentic
          - redteam
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check subdir has package.json
        id: check
        run: |
          if [ -f "${{ matrix.subdir }}/package.json" ]; then
            echo "present=1" >> $GITHUB_OUTPUT
          else
            echo "present=0" >> $GITHUB_OUTPUT
            echo "::notice::No package.json in ${{ matrix.subdir }} — skipping."
          fi

      - name: Install deps
        if: steps.check.outputs.present == '1'
        working-directory: ${{ matrix.subdir }}
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Generate TS SBOM
        if: steps.check.outputs.present == '1'
        working-directory: ${{ matrix.subdir }}
        run: |
          # Slash characters in subdir paths confuse the artifact filename;
          # flatten with a dash so the upload step picks a valid name.
          OUT="sbom-ts-$(echo '${{ matrix.subdir }}' | tr '/' '-').json"
          npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file "$OUT"

      - name: Upload TS SBOM artifact
        if: steps.check.outputs.present == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-ts-${{ matrix.subdir }}
          path: ${{ matrix.subdir }}/sbom-ts-*.json
          retention-days: 90

      - name: Attach to release
        if: steps.check.outputs.present == '1' && github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.subdir }}/sbom-ts-*.json

  python-sbom:
    name: Python SBOM (pip-licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install client + pip-licenses
        run: |
          python -m pip install --upgrade pip
          # `clients/python` ships a pyproject; install it (plus its deps) so
          # pip-licenses sees the full transitive closure.
          pip install ./clients/python pip-licenses

      - name: Generate Python SBOM
        run: |
          pip-licenses --format=json --with-urls --with-license-file --with-system > sbom-python.json
          ls -lh sbom-python.json

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python
          path: sbom-python.json
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: sbom-python.json
