name: Security scans

# Combines four scanners that overlap on different threat surfaces:
#
# - cargo-audit  — RustSec advisory database (CVEs in Rust deps).
# - cargo-deny   — license / ban / source policy on Rust deps.
# - gitleaks     — credentials accidentally committed to the repo.
# - trivy        — filesystem + (optionally) container scan.
#
# Runs on every PR + weekly cron so a freshly published advisory still
# fails the build between releases.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 7 * * 1" # Mondays 07:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  actions-pinned:
    name: immutable GitHub Action references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/ci/check-actions-pinned.sh

  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.1
      - name: Audit core, customer verifier and prover
        run: bash scripts/ci/audit-rust.sh

  cargo-deny:
    name: cargo-deny (bans / licenses / sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: core/Cargo.toml
          command: check
          arguments: --all-features
          log-level: warn

  gitleaks:
    name: gitleaks (committed secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only needed for organisations — leave unset for
          # personal repos and the action falls back to the free tier.

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trivy DB downloads + scans are heavy. Skip on `pull_request` runs from
    # forks unless the PR carries the `security:full` label so spammy PRs
    # don't burn CI minutes.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'security:full')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@fb4bfd79bfa826ce96c90727ff8833835ba8aad0 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
