name: Release Publish

# Publishes distribution artifacts when a version tag is pushed:
#   - container images (core + dashboard) to GitHub Container Registry
#   - @sauronid/agentic to npm        (needs NPM_TOKEN secret)
#   - sauronid-client to PyPI         (uses PyPI trusted publishing / OIDC)
# Publication cannot begin until the complete release gate succeeds. Missing
# credentials fail instead of silently skipping a release channel. crates.io is intentionally not a channel:
# the core is a service distributed as a container image, not a library crate.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  security-gate:
    uses: ./.github/workflows/release-gate.yml

  independent-signoff:
    name: Independent crypto and deployment sign-off
    needs: security-gate
    runs-on: ubuntu-latest
    environment: independent-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify signed assessment against protected reviewer key
        env:
          SAURON_REVIEWER_KEY_SHA256: ${{ secrets.SAURON_REVIEWER_KEY_SHA256 }}
        run: bash scripts/ci/verify-external-assessment.sh "$GITHUB_SHA"

  # Per-platform agent-action-tool binaries. Consumed by the platform wheels,
  # the npm binary package, and attached to the GitHub release.
  tool-binaries:
    needs: independent-signoff
    name: Build agent-action-tool (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,   target: linux-x64,   bin: agent-action-tool,     plat: manylinux_2_17_x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, bin: agent-action-tool,     plat: manylinux_2_17_aarch64 }
          - { os: macos-13,        target: darwin-x64,  bin: agent-action-tool,     plat: macosx_10_12_x86_64 }
          - { os: macos-latest,    target: darwin-arm64, bin: agent-action-tool,    plat: macosx_11_0_arm64 }
          - { os: windows-latest,  target: win32-x64,   bin: agent-action-tool.exe, plat: win_amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1
      - run: cargo build --locked --release --bin agent-action-tool
        working-directory: core
      - run: cargo run --locked --release --bin agent-action-tool -- --help
        working-directory: core
      - if: runner.os != 'Windows'
        run: chmod 755 core/target/release/${{ matrix.bin }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tool-${{ matrix.target }}
          path: core/target/release/${{ matrix.bin }}
          if-no-files-found: error

  wheels:
    name: Platform wheels (sauronid-client)
    needs: [security-gate, tool-binaries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: linux-x64,   bin: agent-action-tool,     plat: manylinux_2_17_x86_64 }
          - { target: linux-arm64, bin: agent-action-tool,     plat: manylinux_2_17_aarch64 }
          - { target: darwin-x64,  bin: agent-action-tool,     plat: macosx_10_12_x86_64 }
          - { target: darwin-arm64, bin: agent-action-tool,    plat: macosx_11_0_arm64 }
          - { target: win32-x64,   bin: agent-action-tool.exe, plat: win_amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tool-${{ matrix.target }}
          path: clients/python/sauronid_client/_bin/
      - run: chmod +x clients/python/sauronid_client/_bin/${{ matrix.bin }}
      - run: python -m pip install "build==1.2.2.post1" "wheel==0.45.1" && python -m build --wheel
        working-directory: clients/python
      - name: Assert wheel contains the downloaded native binary byte-for-byte
        working-directory: clients/python
        env:
          BIN_NAME: ${{ matrix.bin }}
        run: |
          python -c "import glob,hashlib,os,pathlib,zipfile; wheel=glob.glob('dist/*.whl'); assert len(wheel)==1, wheel; source=pathlib.Path('sauronid_client/_bin')/os.environ['BIN_NAME']; z=zipfile.ZipFile(wheel[0]); names=[n for n in z.namelist() if n.endswith('/_bin/'+os.environ['BIN_NAME'])]; assert len(names)==1, names; assert hashlib.sha256(source.read_bytes()).digest()==hashlib.sha256(z.read(names[0])).digest(), 'wheel binary differs from downloaded artifact'; print(names[0])"
      - name: Install-test native wheel before retagging
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import sauronid_client; print('wheel import OK')"
        working-directory: clients/python
      - name: Retag wheel for the target platform
        run: python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag ${{ matrix.plat }} dist/*.whl
        working-directory: clients/python
      - name: Assert final wheel platform tag
        working-directory: clients/python
        env:
          PLATFORM_TAG: ${{ matrix.plat }}
        run: |
          python -c "import glob,os,zipfile; wheel=glob.glob('dist/*.whl'); assert len(wheel)==1, wheel; assert wheel[0].endswith('-'+os.environ['PLATFORM_TAG']+'.whl'), wheel[0]; z=zipfile.ZipFile(wheel[0]); metadata=[n for n in z.namelist() if n.endswith('.dist-info/WHEEL')]; assert len(metadata)==1; assert ('Tag: py3-none-'+os.environ['PLATFORM_TAG']) in z.read(metadata[0]).decode(); print(wheel[0])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: clients/python/dist/*.whl

  npm-tool:
    name: Publish @sauronid/agent-action-tool
    needs: [security-gate, tool-binaries]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tool-*
          path: staging/
      - name: Assemble per-platform bin tree
        run: |
          cd packaging/npm-agent-action-tool
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mkdir -p "bin/$t"
            cp ../../staging/tool-$t/* "bin/$t/"
            chmod +x "bin/$t/"* || true
          done
      - name: Require npm publishing credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for a release" >&2; exit 1; }
      - name: Publish
        run: npm pack && npm publish ./*.tgz --access public
        working-directory: packaging/npm-agent-action-tool
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-agent-action-tool
          path: packaging/npm-agent-action-tool/*.tgz
          if-no-files-found: error

  # The verifiability claim needs the guest source public: a customer must be
  # able to rebuild both guests and compare image IDs, or the IDs pinned in every
  # proof mean nothing. Only transparent-zk/ is required for that, so the
  # gateway, dashboard and deployment stay private. Depends on
  # independent-signoff so the gate has already reproduced the IDs — an
  # unreproducible guest must never be published as a reviewed one.
  transparent-zk-mirror:
    needs: independent-signoff
    name: Mirror reproducible guest source
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push squashed snapshot to the public mirror
        env:
          # owner/name of the public mirror, and a PAT with contents:write on it
          # and nothing else. Absent credentials fail the release rather than
          # silently shipping without the verification path.
          MIRROR_REPO: ${{ vars.SAURON_PUBLIC_ZK_REPO }}
          MIRROR_TOKEN: ${{ secrets.SAURON_PUBLIC_ZK_TOKEN }}
        run: bash scripts/release/mirror-transparent-zk.sh "$GITHUB_REF_NAME"

  images:
    needs: independent-signoff
    name: Push images to GHCR
    runs-on: ubuntu-latest
    environment: production-release
    strategy:
      matrix:
        include:
          # core/Dockerfile builds from the REPOSITORY ROOT, not from core/: it
          # copies core/Cargo.toml and transparent-zk/types, neither of which is
          # visible with core/ as the context. docker-compose.yml already pairs
          # `context: .` with `dockerfile: core/Dockerfile`; this job did not,
          # so the core image build failed on every release tag.
          - name: core
            context: .
            dockerfile: core/Dockerfile
          - name: dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # The Dockerfile splits dependencies into their own layer, but on an
          # ephemeral runner that layer is rebuilt from nothing every time
          # unless it is exported somewhere. GitHub's cache backend is that
          # somewhere: with it, a release whose Cargo.lock is unchanged reuses
          # the ~600-crate dependency layer instead of recompiling it.
          #
          # Safe for a release artifact because the cache keys on layer content,
          # not on a tag — a changed lockfile changes the layer and misses the
          # cache. The final `cargo build --locked` still pins the exact
          # dependency graph either way.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Provenance and an SBOM were already attached, but nothing bound them to
      # this repository: an attacker who can push to the registry can attach
      # their own. Keyless signing puts a Fulcio certificate on the digest
      # carrying the workflow identity, so a customer can verify the image they
      # are about to run was built by this workflow from this repository, and
      # refuse it otherwise.
      #
      # The signed digest is the image INDEX digest, which references the
      # provenance and SBOM attestation manifests, so pinning it transitively
      # pins those too.
      #
      # This is what closes gateway integrity for a self-hosted customer: they
      # verify the digest, pin the digest, and start the process themselves, so
      # they know exactly what is running without reading our source. It proves
      # nothing about an instance somebody else operates — see
      # docs/attestation-scope.md.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image digest (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature we just made
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
        # Publishing a signature nobody has ever verified is how an unusable
        # verification path ships. This runs the customer's own command against
        # the identity documented for them, so a mismatch fails the release
        # rather than the customer.
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
          printf 'signed and verified %s@%s\n' "$IMAGE" "$DIGEST"

  npm:
    needs: independent-signoff
    name: Publish @sauronid/agentic
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: agentic
      - run: npm run build && npm test
        working-directory: agentic
      - name: Require npm publishing credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for a release" >&2; exit 1; }
      - name: Publish
        run: npm pack && npm publish ./*.tgz --access public
        working-directory: agentic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-agentic
          path: agentic/*.tgz
          if-no-files-found: error

  pypi:
    name: Publish sauronid-client
    needs: [security-gate, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # sdist has no bundled binary; it falls back to env/PATH/repo lookup.
      - run: python -m pip install "build==1.2.2.post1" && python -m build --sdist
        working-directory: clients/python
      - name: Assert source distribution has no workstation binary
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/agent-action-tool(\.exe)?$'; then
            echo "source distribution contains a platform binary" >&2
            exit 1
          fi
        working-directory: clients/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdist
          path: clients/python/dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: clients/python/dist/
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: clients/python/dist

  github-release:
    name: Immutable release assets and checksums
    needs: [tool-binaries, wheels, npm-tool, images, npm, pypi, transparent-zk-mirror]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tool-*
          path: release-assets/tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: release-assets/wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          merge-multiple: true
          path: release-assets/npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-sdist
          path: release-assets/python
      - name: Verify annotated tag and create checksums
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag || {
            echo "release tag must be annotated (prefer a verified signature)" >&2
            exit 1
          }
          find release-assets -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
          sha256sum -c release-assets/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
